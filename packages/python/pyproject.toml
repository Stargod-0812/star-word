[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "star-word"
version = "0.4.2"
description = "中文技术写作规则集（22 条）+ LLM-as-judge + MCP server. Drop-in for Claude Code, Codex, Cursor, AGENTS.md-compatible agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Stargod-0812" }]
keywords = ["writing", "chinese", "linter", "claude-code", "agent", "rules", "llm", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Natural Language :: Chinese (Simplified)",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Stargod-0812/star-word"
Repository = "https://github.com/Stargod-0812/star-word"
Issues = "https://github.com/Stargod-0812/star-word/issues"

[project.scripts]
star-word = "star_word.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "hypothesis>=6.0", "ruff>=0.1.0", "mypy>=1.0"]
fuzz = ["hypothesis>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["star_word*"]

[tool.setuptools.package-data]
star_word = ["data/**/*.md", "data/**/*.json", "data/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# E501 line-length 已在 line-length 设置；B008 mutable default in dataclass 不适用
# UP rules 关闭：要保持 Python 3.9 兼容（X | None 是 3.10+）
ignore = ["E501", "B008", "B904"]

[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
