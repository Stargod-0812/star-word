name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable + dev deps)
        run: |
          cd packages/python
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: |
          cd packages/python
          python -m pytest tests/ -v

      - name: Verify rules.yaml → artifacts drift-free
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python3 scripts/build.py --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev deps
        run: |
          cd packages/python
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          cd packages/python
          ruff check star_word/ tests/

      - name: Mypy (non-blocking, info-only)
        continue-on-error: true
        run: |
          cd packages/python
          mypy star_word/ --ignore-missing-imports || true

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with coverage
        run: |
          cd packages/python
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          cd packages/python
          python -m pytest --cov=star_word --cov-report=term-missing --cov-fail-under=80 tests/

  smoke:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          cd packages/python
          pip install -e .

      - name: End-to-end enable → review → disable
        run: |
          mkdir -p /tmp/sw-ci && cd /tmp/sw-ci
          star-word --version
          star-word handshake
          star-word surfaces
          star-word enable claude-code
          test -f CLAUDE.md
          test -f .sw/rules.md
          test -f .sw/claude.md
          grep -q "sw-managed-begin" CLAUDE.md
          grep -q "@.sw/claude.md" CLAUDE.md
          echo "值得注意的是，稳稳接住流量。" > dirty.md
          if star-word review dirty.md; then
            echo "✗ review 应返回非 0 退出码"
            exit 1
          fi
          # 检查 score 输出
          star-word review dirty.md --json | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'score' in d, 'missing score field'; assert d['score']['score'] is not None, 'score is null'"
          star-word disable claude-code
          test ! -d .sw

      - name: MCP server smoke test
        run: |
          # 启 MCP server，发 initialize + tools/list，验返回
          (cat <<EOF
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}
          {"jsonrpc":"2.0","id":2,"method":"tools/list"}
          {"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_rules","arguments":{}}}
          EOF
          ) | python -m star_word.mcp_server > /tmp/mcp-out.txt
          cat /tmp/mcp-out.txt
          grep -q '"protocolVersion"' /tmp/mcp-out.txt
          grep -q '"review_text"' /tmp/mcp-out.txt
          grep -q '"version"' /tmp/mcp-out.txt
